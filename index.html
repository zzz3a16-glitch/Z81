<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="midnight-neon" data-density="comfortable" data-sidebar="full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zPopcorn</title>
  <meta name="description" content="zPopcorn — مكتبة الوسائط الذكية المحلية. منصة سطح مكتب لإدارة الأفلام والمسلسلات.">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    /* pre-paint theme so the splash matches the app (no flash) */
    try {
      var t = JSON.parse(localStorage.getItem('zpopcorn-theme') || '"midnight-neon"');
      if (typeof t === 'object' && t) t = t.id || 'midnight-neon';
      if (typeof t === 'string') document.documentElement.setAttribute('data-theme', t);
      var d = localStorage.getItem('zpopcorn-density'); if (d) document.documentElement.setAttribute('data-density', d);
      if (localStorage.getItem('zpopcorn-sb-rail') === '1') document.documentElement.setAttribute('data-sidebar', 'rail');
      /* theme-engine v2: pre-paint density/scale/accent/canvas from saved config */
      var ap = JSON.parse(localStorage.getItem('zpopcorn-appearance') || 'null');
      if (ap && ap.enabled !== false) {
        var R = document.documentElement;
        if (ap.density) R.setAttribute('data-density', ap.density);
        if (ap.cards && ap.cards.style) R.setAttribute('data-z-card', ap.cards.style);
        if (ap.accentMode) R.setAttribute('data-z-accent-mode', ap.accentMode);
        if (ap.uiScale && ap.uiScale !== 1) R.style.zoom = ap.uiScale;
        if (ap.background && ap.background.type === 'gradient') {
          var g = ap.background.gradient || {};
          R.style.setProperty('--z-bg-gradient', 'linear-gradient(' + (g.angle || 160) + 'deg,' + (g.from || '#0B0B0D') + ',' + (g.to || '#141417') + ')');
          R.setAttribute('data-z-bg', 'gradient');
        } else if (ap.background && ap.background.type) R.setAttribute('data-z-bg', ap.background.type);
        var c = (ap.colors || {}); var A = ap.accent || {};
        if (c['bg-app']) R.style.setProperty('--surface-0', c['bg-app']);
        if (A.primary) { R.style.setProperty('--accent', A.primary); }
        if (A.secondary) R.style.setProperty('--accent-2', A.secondary);
        if (ap.accentMode === 'gradient' && A.primary)
          R.style.setProperty('--accent-grad', 'linear-gradient(' + (A.angle || 135) + 'deg,' + A.primary + ',' + (A.secondary || A.primary) + ')');
        if (ap.radius && ap.radius.base != null && ap.radius.preset !== 'sharp') R.style.setProperty('--r-lg', ap.radius.base + 'px');
      }
    } catch (e) { /* defaults */ }
  </script>
</head>
<body>
  <div class="z-splash" id="z-splash" aria-hidden="true">
    <div style="text-align:center">
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10.5C6 9.8 6 8 7.2 7.2 8.4 6.4 10 7 10.4 8.2c.6-1.4 2.4-1.8 3.6-.8 1.2.9 1.2 2.7.1 3.5"/><path d="M6.8 10.8h10.4l-1.1 8a1.8 1.8 0 0 1-1.8 1.6H9.7a1.8 1.8 0 0 1-1.8-1.6zM9.4 13.5v4.2M12 13v4.8M14.6 13.5v4.2"/></svg>
      </div>
      <div class="word">zPopcorn</div>
      <div class="bar"></div>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
